version: 1

defaults:
  stage_notes:
    local: Keep work local-first, isolated, and reversible.
    hosted_dev: Promote only after local evidence exists and keep scope constrained.
    production: Require explicit approvals, audit logs, and rollback plans.
  pass_notes:
    research: Collect upstream facts and current documentation before implementation.
    development: Reuse upstream formats and reference implementations instead of inventing new schemas.
    testing: Validate behavior in a controlled target and store reproducible evidence.

principles:
  - id: authorized_scope_only
    text: Run only on systems and targets you are explicitly authorized to assess.
  - id: source_before_custom
    text: Prefer maintained community standards and formats before custom backend design.
  - id: minimal_base_on_demand_tools
    text: Keep the base package lean and assemble optional tooling on first use.
  - id: lifecycle_enforced
    text: Apply the 3x3 lifecycle in order (local -> hosted_dev -> production, and research -> development -> testing).
  - id: framework_first
    text: Default to preexisting, established open-source frameworks (LangChain/smolagents for agents, FastAPI for APIs, Chart.js for visualization) before writing custom parsers, agents, or UI from scratch.
  - id: openclaw_gateway_baseline
    text: Treat the OpenClaw Gateway substrate (ops panel, webhooks, iPhone panel, chat embeddings) as the foundational baseline for all related development and alignment efforts.
  - id: ux_hand_eye_accessible
    text: All human-facing interfaces must be reachable by hand (min 44px touch targets, logical ordering) and eye (high contrast, clear hierarchy, ARIA screen-reader support, focus-visible states).
  - id: ux_iterative_evolution
    text: Build interfaces that are logically ordered, easy to produce, and designed to evolve iteratively alongside user needs and product growth.

tracks:
  - id: openclaw_gateway_baseline
    name: OpenClaw Gateway Baseline
    description: The OpenClaw Gateway substrate and its included components are the foundational baseline for all related development. This track covers the ops panel (FastAPI + Jinja2), webhook gateway (WhatsApp, etc.), iPhone panel extensions, embedded chat, dashboard, pipelines, and security hardening.
    tags: [openclaw, gateway, fastapi, jinja2, panel, webhooks, baseline]
    standards:
      - id: openclaw_gateway_panel
        name: OpenClaw Gateway Ops Panel
        format: FastAPI + Jinja2 + vanilla JS control panel served on 127.0.0.1:8090.
        source_url: https://github.com/55515-code/orchestrator
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: This is the primary ops UI. All new development that affects operator workflows must align with the panel's existing routes, security model (origin/host checks, bearer auth, rate limiting), and UX patterns.
      - id: openclaw_gateway_security
        name: OpenClaw Gateway Security Hardening
        format: Origin/host CSRF + DNS-rebinding checks, HMAC-protected webhook exemptions, bearer-token auth, per-IP rate limiting, XSS hardening, shell-injection hardening.
        source_url: https://github.com/55515-code/orchestrator/blob/main/substrate/web.py
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: Reuse the existing security middleware in substrate/web.py for all new state-changing endpoints. Do not bypass origin/host checks or bearer auth for new routes.
      - id: openclaw_gateway_chat
        name: OpenClaw Gateway Embedded Chat
        format: Kilo chat agent embedded under the panel's own /api/* paths via ChatbotApp.
        source_url: https://github.com/55515-code/orchestrator/blob/main/substrate/chatbot/
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: New automation surfaces should hook into the same task queue so the browser UI can run real autonomous sessions.
      - id: openclaw_gateway_iphone
        name: OpenClaw Gateway iPhone Panel
        format: iPhone webapp panel extensions (automations + live system stream) mounted under the same FastAPI app.
        source_url: https://github.com/55515-code/orchestrator/blob/main/substrate/iphone_panel.py
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: Additive extensions only. Reuse the existing router inclusion pattern (app.include_router(iphone_panel_router)).

  - id: web_ux_accessibility
    name: Web UX and Accessibility
    description: Standards for intuitive hand and eye interaction with operator tooling. All interfaces must be logically ordered, easy to produce, and designed to evolve iteratively.
    tags: [ux, accessibility, wcag, aria, touch, keyboard, screen-reader, fastapi, jinja2, chartjs]
    standards:
      - id: wcag_2_1_aa
        name: WCAG 2.1 AA
        format: Web Content Accessibility Guidelines.
        source_url: https://www.w3.org/WAI/WCAG21/quickref/
        repo_url: https://github.com/w3c/wcag
        maintained_by: W3C
        notes: All new panel pages, modals, and forms must meet WCAG 2.1 AA. Minimum touch target 44x44 CSS pixels. Use escapeHtml() before innerHTML interpolation.
      - id: fastapi_panel
        name: FastAPI Panel Pattern
        format: Async FastAPI routes with Jinja2 templates, static files, and security middleware.
        source_url: https://fastapi.tiangolo.com/
        repo_url: https://github.com/fastapi/fastapi
        maintained_by: FastAPI team
        notes: Reuse the existing security middleware, rate limiting, and auth bootstrap patterns in substrate/web.py for all new panel endpoints.
      - id: chartjs_visualization
        name: Chart.js Visualization
        format: Canvas-based charts via Chart.js v4 for metrics, telemetry, and simulation data.
        source_url: https://www.chartjs.org/
        repo_url: https://github.com/chartjs/Chart.js
        maintained_by: Chart.js contributors
        notes: Use Chart.js for all new dashboard visualizations rather than custom canvas code.
      - id: vanilla_js_established_libs
        name: Vanilla JS with Established Libraries
        format: Plain JavaScript plus maintained libraries (Chart.js, no build step required).
        source_url: https://github.com/55515-code/orchestrator/tree/main/substrate/static
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: Prefer CDN-linked established libraries over npm/bundler complexity for the panel frontend. Keep the base package lean; assemble optional tooling on first use.

  - id: ai_agent_orchestration
    name: AI Agent Orchestration
    description: Open-source agent frameworks and multi-agent collaboration patterns for composable, auditable automation.
    tags: [agents, ai, orchestration, multi-agent, huggingface, langchain, langgraph]
    standards:
      - id: smolagents
        name: Hugging Face smolagents
        format: Code-first agent framework with CodeAgent, ToolCallingAgent, and managed multi-agent hierarchies.
        source_url: https://huggingface.co/docs/smolagents
        repo_url: https://github.com/huggingface/smolagents
        maintained_by: Hugging Face
        notes: Default agent framework per workspace policy. Prefer code-agent loops and tool-agnostic design over custom agent parsers; execute generated code in sandboxed environments.
      - id: langgraph
        name: LangGraph
        format: Structured orchestration for agent workflows with durable state patterns.
        source_url: https://langchain-ai.github.io/langgraph/
        repo_url: https://github.com/langchain-ai/langgraph
        maintained_by: LangChain team
        notes: Default orchestration framework per workspace policy. Reuse graph-based state machines for chain workflows instead of ad-hoc step runners.
      - id: langchain
        name: LangChain
        format: LLM application framework with providers, prompts, chains, and agents.
        source_url: https://python.langchain.com/
        repo_url: https://github.com/langchain-ai/langchain
        maintained_by: LangChain team
        notes: Reuse LangChain provider adapters, prompt templates, and retry policies instead of rolling custom LLM client code.
      - id: agent_collabs
        name: Hugging Face agent-collabs
        format: Multi-agent collaboration challenge template with FastAPI backend, message board, taskforces, and leaderboard.
        source_url: https://huggingface.co/learn/agents-course
        repo_url: https://github.com/huggingface/agent-collabs
        maintained_by: Hugging Face
        notes: Reuse the message-board / taskforce / verification pattern when coordinating multiple specialized agents.

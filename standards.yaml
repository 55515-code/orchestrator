version: 1

defaults:
  stage_notes:
    local: Keep work local-first, isolated, and reversible.
    hosted_dev: Promote only after local evidence exists and keep scope constrained.
    production: Require explicit approvals, audit logs, and rollback plans.
  pass_notes:
    research: Collect upstream facts and current documentation before implementation.
    development: Reuse upstream formats and reference implementations instead of inventing new schemas.
    testing: Validate behavior in a controlled target and store reproducible evidence.

principles:
  - id: authorized_scope_only
    text: Run only on systems and targets you are explicitly authorized to assess.
  - id: source_before_custom
    text: Prefer maintained community standards and formats before custom backend design.
  - id: minimal_base_on_demand_tools
    text: Keep the base package lean and assemble optional tooling on first use.
  - id: lifecycle_enforced
    text: Apply the 3x3 lifecycle in order (local -> hosted_dev -> production, and research -> development -> testing).

tracks:
  - id: device_inspired_ops
    name: Device-Inspired Operations
    description: Rubber Ducky and Flipper-style workflows adapted to software orchestration patterns.
    tags: [ducky, flipper, payloads, automation]
    standards:
      - id: duckyscript3
        name: DuckyScript 3.0
        format: DuckyScript source compiled to payload binaries.
        source_url: https://docs.hak5.org/hak5-usb-rubber-ducky/usb-rubber-ducky-by-hak5/
        repo_url: https://github.com/hak5/usbrubberducky-payloads
        maintained_by: Hak5 + community payload contributors
        notes: Use official DuckyScript compatibility and payload conventions as baseline behavior.
      - id: flipper_badusb
        name: Flipper BadUSB Script Format
        format: Text script format with delay/default-delay and keycode controls.
        source_url: https://developer.flipper.net/flipperzero/doxygen/badusb_file_format.html
        repo_url: https://github.com/flipperdevices/flipperzero-firmware
        maintained_by: Flipper Devices
        notes: Keep parser/adapter compatibility with documented BadUSB directives.
      - id: flipper_subghz
        name: Flipper Sub-GHz Key File Format
        format: Structured key file format for captured/saved sub-GHz data.
        source_url: https://developer.flipper.net/flipperzero/doxygen/subghz_file_format.html
        repo_url: https://github.com/flipperdevices/flipperzero-firmware
        maintained_by: Flipper Devices
        notes: Reuse official file field names when modeling RF metadata in workflows.

  - id: distro_baselines
    name: Distro Baselines
    description: Kali/Parrot packaging and maintenance norms for trusted offensive-security toolchains.
    tags: [kali, parrot, packaging, maintenance]
    standards:
      - id: kali_metapackages
        name: Kali Metapackages
        format: Debian metapackages that bundle tool categories.
        source_url: https://www.kali.org/docs/general-use/metapackages/
        repo_url: https://gitlab.com/kalilinux/packages/kali-meta
        maintained_by: Kali Linux
        notes: Prefer metapackage-based composition over ad-hoc tool lists.
      - id: kali_tool_lifecycle
        name: Kali Tool Curation Lifecycle
        format: Documented add/remove criteria for tools.
        source_url: https://www.kali.org/docs/tools/removed-tools/
        repo_url: https://www.kali.org/docs/tools/submitting-tools/
        maintained_by: Kali Linux
        notes: Mirror this model by pruning stale integrations and requiring maintenance signals.
      - id: parrot_signed_mirrors
        name: Parrot Signed Mirror Distribution
        format: Mirror network with centralized digital signature checks.
        source_url: https://www.parrotsec.org/docs/mirrors/mirrors-list/
        repo_url: https://github.com/ParrotSec
        maintained_by: Parrot Security
        notes: Align remote package intake with signed and centrally controlled update flows.

  - id: threat_research_formats
    name: Threat Research Formats
    description: Widely used open standards for adversary mapping, atomic tests, detections, and templates.
    tags: [mitre, detection, templates, research]
    standards:
      - id: mitre_attack
        name: MITRE ATT&CK
        format: Structured adversary knowledge base and mappings.
        source_url: https://attack.mitre.org/resources/
        repo_url: https://github.com/mitre-attack
        maintained_by: MITRE ATT&CK
        notes: Map automation intents to ATT&CK technique references for traceability.
      - id: atomic_red_team
        name: Atomic Red Team
        format: Atomic test definitions mapped to ATT&CK.
        source_url: https://github.com/redcanaryco/atomic-red-team
        repo_url: https://github.com/redcanaryco/atomic-red-team
        maintained_by: Red Canary + community
        notes: Reuse existing atomic tests for validation before writing custom test harnesses.
      - id: sigma_rules
        name: Sigma Detection Rule Format
        format: YAML-based generic detection rule schema.
        source_url: https://sigmahq.io/
        repo_url: https://github.com/SigmaHQ/sigma
        maintained_by: SigmaHQ
        notes: Keep detection content in Sigma-compatible YAML to stay backend-agnostic.
      - id: nuclei_templates
        name: Nuclei Template Format
        format: YAML templates for repeatable security checks.
        source_url: https://docs.projectdiscovery.io/templates/introduction
        repo_url: https://github.com/projectdiscovery/nuclei-templates
        maintained_by: ProjectDiscovery + community
        notes: Prefer maintained template sets for checks rather than one-off scanner scripts.

  - id: android_security_ops
    name: Android Security Ops
    description: Open-source Android tooling standards for authorized reverse engineering and app security testing.
    tags: [android, mobile, reverse-engineering]
    standards:
      - id: android_platform_tools
        name: Android SDK Platform-Tools
        format: Official adb/fastboot host tooling distribution.
        source_url: https://developer.android.com/tools/releases/platform-tools
        repo_url: https://developer.android.com/tools/releases/platform-tools
        maintained_by: Android Developers
        notes: Treat platform-tools as the baseline transport layer for Android workflows.
      - id: apktool
        name: Apktool
        format: APK decode/build workflow for Android resources and smali.
        source_url: https://apktool.org/
        repo_url: https://github.com/iBotPeaches/Apktool
        maintained_by: Apktool project
        notes: Use canonical Apktool decode/build paths before custom APK unpackers.
      - id: jadx
        name: JADX
        format: Dex to Java decompilation and interactive code review.
        source_url: https://github.com/skylot/jadx
        repo_url: https://github.com/skylot/jadx
        maintained_by: JADX maintainers
        notes: Reuse JADX output conventions when generating static-analysis artifacts.
      - id: mobsf
        name: Mobile Security Framework (MobSF)
        format: Automated mobile app static/dynamic analysis framework.
        source_url: https://github.com/MobSF/Mobile-Security-Framework-MobSF
        repo_url: https://github.com/MobSF/Mobile-Security-Framework-MobSF
        maintained_by: MobSF maintainers
        notes: Prefer MobSF scans as first-pass evidence before custom analyzers.
      - id: frida
        name: Frida
        format: Dynamic instrumentation framework and CLI tooling.
        source_url: https://frida.re/docs/frida-cli/
        repo_url: https://github.com/frida/frida
        maintained_by: Frida maintainers
        notes: Use Frida for runtime instrumentation hooks instead of proprietary agents.
      - id: owasp_mas
        name: OWASP MASVS and MASTG
        format: Mobile AppSec verification and testing standards.
        source_url: https://mas.owasp.org/
        repo_url: https://github.com/OWASP/owasp-mastg
        maintained_by: OWASP Mobile Security Project
        notes: Align test evidence and reporting with MASVS/MASTG control language.

  - id: ai_agent_orchestration
    name: AI Agent Orchestration
    description: Open-source agent frameworks and multi-agent collaboration patterns for composable, auditable automation.
    tags: [agents, ai, orchestration, multi-agent, huggingface]
    standards:
      - id: smolagents
        name: Hugging Face smolagents
        format: Code-first agent framework with CodeAgent, ToolCallingAgent, and managed multi-agent hierarchies.
        source_url: https://huggingface.co/docs/smolagents
        repo_url: https://github.com/huggingface/smolagents
        maintained_by: Hugging Face
        notes: Prefer code-agent loops and tool-agnostic design over custom agent parsers; execute generated code in sandboxed environments.
      - id: agent_collabs
        name: Hugging Face agent-collabs
        format: Multi-agent collaboration challenge template with FastAPI backend, message board, taskforces, and leaderboard.
        source_url: https://huggingface.co/learn/agents-course
        repo_url: https://github.com/huggingface/agent-collabs
        maintained_by: Hugging Face
        notes: Reuse the message-board / taskforce / verification pattern when coordinating multiple specialized agents.

  - id: llm_serving
    name: LLM Serving
    description: Production-grade open-source inference engines for local and hosted LLM deployments.
    tags: [llm, inference, serving, vllm, sglang]
    standards:
      - id: vllm
        name: vLLM
        format: OpenAI-compatible LLM serving engine with PagedAttention, continuous batching, and broad hardware support.
        source_url: https://docs.vllm.ai/
        repo_url: https://github.com/vllm-project/vllm
        maintained_by: vLLM Project / Linux Foundation
        notes: Default production serving choice recommended by Hugging Face after TGI maintenance-mode transition.
      - id: sglang
        name: SGLang
        format: Structured generation and LLM serving runtime with RadixAttention for shared-prefix workloads.
        source_url: https://docs.sglang.ai/
        repo_url: https://github.com/sgl-project/sglang
        maintained_by: SGLang Team / LMSYS
        notes: Prefer for agentic, multi-turn, and RAG workloads with heavy prefix reuse.

  - id: local_automation_optimization
    name: Local Automation Optimization
    description: Caching, memoization, and task-decomposition patterns that reduce redundant AI calls and repeated computation in local automation workflows.
    tags: [cache, memoization, optimization, local, automation]
    standards:
      - id: substrate_local_cache_workflow
        name: Substrate Local Cache Workflow
        format: SQLite + filesystem cache keyed by deterministic SHA-256 hashes of (kind, inputs), with summaries, TTL, tags, and pruning.
        source_url: https://github.com/55515-code/orchestrator/blob/main/docs/caching.md
        repo_url: https://github.com/55515-code/orchestrator
        maintained_by: Local Agent Substrate
        notes: Cache AI calls, subtask results, and plans; decompose large objectives into smaller cacheable units; prefer cache hits over repeated LLM calls.
      - id: diskcache
        name: diskcache
        format: Disk and file-backed Python cache with SQLite metadata, tag-based eviction, and memoization recipes.
        source_url: https://diskcache.readthedocs.io/
        repo_url: https://github.com/grantjenks/python-diskcache
        maintained_by: Grant Jenks / community
        notes: Consider for larger persistent caches or drop-in memoization when the substrate cache needs richer eviction policies.
      - id: cachetools
        name: cachetools
        format: Lightweight in-memory Python caching with TTL, LRU, and LFU policies.
        source_url: https://cachetools.readthedocs.io/
        repo_url: https://github.com/tkem/cachetools
        maintained_by: Thomas Kemmer / community
        notes: Use for short-lived, in-process memoization of deterministic helper functions.
      - id: joblib_memory
        name: Joblib Memory
        format: Disk-based memoization of Python functions optimized for NumPy/scikit-learn workloads.
        source_url: https://joblib.readthedocs.io/
        repo_url: https://github.com/joblib/joblib
        maintained_by: scikit-learn / Joblib maintainers
        notes: Use for deterministic heavy computations and data pipelines where function source-code hashing is acceptable.

  - id: decentralized_governance_networks
    name: Decentralized Governance Networks
    description: Commons-based, non-hierarchical organizational models rooted in socialist, anarchist, cooperative, Indigenous, and federated governance traditions. Embeds decentralization, collective awareness, consensus-driven data, non-Westernized perspectives, and transparent value systems into substrate operations.
    tags: [commons, cooperative, anarchist, indigenous, federated, dignity, liberation, consensus, mutualism]
    standards:
      - id: dignity_stack_layers
        name: Dignity Stack Six-Layer Governance
        format: Governance overlay mapping technological oversight, data sovereignty, contextual integrity, fiduciary limits, participatory governance, and economic justice to commons-based organizational protocols.
        source_url: https://arxiv.org/abs/2606.06083
        notes: Enforce capital-governance decoupling; verify inter-layer dependencies; resist formal and structural capture through polycentric, substitutable supply.
      - id: liberation_stack_layers
        name: Liberation Stack Layered Architecture
        format: Directed acyclic dependency graph of energy, manufacturing, food, communication, knowledge, and governance commons with explicit gate conditions and threat models.
        source_url: https://arxiv.org/abs/2602.13154
        notes: Each layer has function, dependencies, gate condition, threat model, and governance hooks. No layer deploys sustainably without lower layers.
      - id: consensuscode_horizontal_collective
        name: Consensus Code Horizontal Agent Collective
        format: True consensus decision-making with temporary/revocable coordination roles, 50% teaching / 50% doing commitment, anti-hierarchy safeguards, and transparent reasoning documentation.
        source_url: https://github.com/notque/consensuscode
        notes: All coordination roles temporary; no permanent authority; collective accountability for all agents including facilitators.
      - id: coop_kernel_democratic_core
        name: coop-kernel Democratic Software Cooperative Core
        format: 1 person = 1 vote governance; algorithmic fairness via formula-based earnings (Time × Complexity = Share); lazy consensus with 48-hour approval window; right to fork guarantee.
        source_url: https://github.com/abdozkaya/coop-kernel
        notes: Capital provides no extra governance rights; labor governs; revenue sharing transparent and non-negotiable.
      - id: intercooperative_network_constraint_engine
        name: InterCooperative Network Constraint Enforcement
        format: P2P constraint engine with strict Meaning Firewall (kernel enforces constraints blindly; apps translate governance into generic ConstraintSet via PolicyOracle); Cooperative Contract Language (CCL) non-Turing-complete; mutual credit ledger.
        source_url: https://intercooperative.network/
        notes: Kernel never sees domain semantics; apps translate meaning; federation preserves autonomy via bilateral agreements.
      - id: indigenous_data_sovereignty_care
        name: Indigenous Data Sovereignty (CARE Principles)
        format: Collective Benefit, Authority to Control, Responsibility, Ethics applied to all data lifecycle stages; data governed as extension of collective identity, memory, kinship, territory.
        source_url: https://www.un.org/digital-emerging-technologies/sites/www.un.org.techenvoy/files/GDC-submission_WAMPUM_Lab_and_the_Collaboratory_for_Indigenous.pdf
        notes: Data is not resource/commodity; requires community permission, restrictions, oversight; ex-situ repositories under hybrid agreements; intergenerational responsibility.
      - id: fediverse_covenantal_federalism
        name: Fediverse Covenantal Federalism
        format: Decentralized governance through shared-value covenants (not contracts); instance sovereignty with federated diplomacy; defederation as only cross-instance governance lever; local norms dominate over network dynamics.
        source_url: https://doi.org/10.1080/1369118x.2022.2147400
        notes: Governance priorities converge across scales (harassment, hate speech, illegal content); local autonomy preserved; federation requires overlapping shared norms.
      - id: liberation_stack_universal_desired_resources
        name: Universal Desired Resources (UDR)
        format: Post-monetary allocation principle for zero-marginal-cost goods distributed by need (not price) subject to ecological feasibility constraint; mutual credit surplus distribution democratically governed.
        source_url: https://arxiv.org/abs/2602.13154
        notes: Conditional on strong automation; eliminates material basis of structural inequality; requires democratic surplus rules, not wealth-weighted claims.

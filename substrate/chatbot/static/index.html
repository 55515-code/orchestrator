<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substrate Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #161a22;
    --bg-input: #1b202b;
    --border: #262d3b;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #4a90d9;
    --accent-soft: rgba(74, 144, 217, 0.15);
    --ok: #34c759;
    --warn: #ff9f0a;
    --err: #ff5f56;
    --radius: 10px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .subtitle { color: var(--text-dim); font-size: 12px; }
  .spacer { flex: 1; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  button {
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  select {
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    max-width: 220px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 82%; display: flex; flex-direction: column; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant .bubble { background: var(--bg-soft); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; padding: 0 4px; }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--accent-soft);
    border: 1px solid rgba(74, 144, 217, 0.3);
    border-radius: 6px;
    padding: 3px 8px;
    margin: 2px 4px 2px 0;
    font-family: var(--mono);
  }
  .model-tag { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .error-banner {
    background: rgba(255, 95, 86, 0.12);
    border: 1px solid rgba(255, 95, 86, 0.4);
    color: var(--err);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    white-space: pre-wrap;
  }
  .code {
    display: block;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    overflow-x: auto;
    margin: 6px 0;
    white-space: pre;
  }
  .inline-code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: #0a0d12;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .typing { opacity: 0.7; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  #composer {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg-soft);
    border-top: 1px solid var(--border);
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: var(--bg-input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    font-family: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  #empty-state .logo { font-size: 44px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">Substrate Chat</div>
    <div class="subtitle" id="subtitle">connecting…</div>
  </div>
  <div class="spacer"></div>
  <select id="session-picker" title="Switch session" style="display:none"></select>
  <button id="new-chat" title="Start a new conversation">+ New chat</button>
  <span class="status-pill"><span class="dot" id="status-dot"></span><span id="status-text">idle</span></span>
</header>

<div id="messages">
  <div id="empty-state">
    <div class="logo">&#128172;</div>
    <div>Ask the agent to automate a desktop or internet task.</div>
    <div>It runs autonomously with your configured Kilo permissions.</div>
  </div>
</div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="Describe the task… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send" class="primary">Send</button>
  <button id="stop" title="Cancel the running task" style="display:none">Stop</button>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let currentSession = null;
let stream = null;
let activeBubble = null;
let busy = false;

function esc(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderMarkdown(text) {
  let out = "";
  const blocks = text.split(/(```[^`]*```)/g);
  for (const block of blocks) {
    if (block.startsWith("```")) {
      const code = block.slice(3);
      const newline = code.indexOf("\n");
      let lang = "";
      let body = code;
      if (newline !== -1) { lang = code.slice(0, newline).trim(); body = code.slice(newline + 1); }
      body = body.replace(/```\s*$/, "");
      out += '<code class="code" data-lang="' + esc(lang) + '">' + esc(body.trimEnd()) + "</code>";
    } else {
      out += block;
    }
  }
  let rendered = esc(out);
  rendered = rendered.replace(/`([^`\n]+)`/g, '<span class="inline-code">$1</span>');
  rendered = rendered.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  rendered = rendered.replace(/(^|\n)[*-] (.+)/g, "$1• $2");
  rendered = rendered.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  return rendered;
}

function bubbleHtml() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = '<div class="bubble cursor typing"></div><div class="meta"></div>';
  return div;
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = '<div class="bubble">' + (role === "user" ? esc(text) : renderMarkdown(text)) + "</div>";
  const ts = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  el.insertAdjacentHTML("beforeend", '<div class="meta">' + (role === "user" ? "you" : "agent") + " · " + ts + "</div>");
  $("messages").appendChild(el);
  scrollBottom();
  return el;
}

function ensureAssistantBubble() {
  if (!activeBubble) {
    activeBubble = bubbleHtml();
    $("messages").appendChild(activeBubble);
  }
  const bubble = activeBubble.querySelector(".bubble");
  bubble.classList.remove("cursor", "typing");
  return bubble;
}

function scrollBottom() {
  const m = $("messages");
  m.scrollTop = m.scrollHeight;
}

function setBusy(state) {
  busy = state;
  $("status-dot").classList.toggle("busy", state);
  $("status-text").textContent = state ? "working" : "idle";
  $("send").disabled = state;
  $("stop").style.display = state ? "inline-block" : "none";
  if (state && activeBubble) activeBubble.querySelector(".bubble").classList.add("cursor");
}

async function refreshSessions() {
  const res = await fetch("/api/sessions");
  const data = await res.json();
  const picker = $("session-picker");
  const sessions = data.sessions || [];
  picker.style.display = sessions.length > 1 ? "inline-block" : "none";
  picker.innerHTML = "";
  for (const s of sessions) {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = (s.title || "Untitled chat").slice(0, 40);
    if (s.id === currentSession) opt.selected = true;
    picker.appendChild(opt);
  }
}

async function loadSession(sessionId) {
  currentSession = sessionId;
  $("messages").innerHTML = "";
  activeBubble = null;
  const empty = document.createElement("div");
  empty.id = "empty-state";
  empty.innerHTML = '<div class="logo">&#128172;</div><div>Ask the agent to automate a desktop or internet task.</div>';
  $("messages").appendChild(empty);
  const res = await fetch("/api/sessions/" + sessionId);
  const data = await res.json();
  for (const msg of data.messages || []) {
    if (msg.role === "user") addMessage("user", msg.content);
    else {
      const el = addMessage("assistant", "");
      el.querySelector(".bubble").innerHTML = renderMarkdown(msg.content);
    }
  }
  if (data.messages && data.messages.length) $("empty-state").remove();
  await refreshSessions();
}

async function newChat() {
  const res = await fetch("/api/sessions", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const data = await res.json();
  await loadSession(data.session_id);
}

async function init() {
  const res = await fetch("/api/sessions");
  const data = await res.json();
  const sessions = data.sessions || [];
  if (sessions.length) {
    await loadSession(sessions[0].id);
  } else {
    await newChat();
  }
  const status = await (await fetch("/api/status")).json();
  $("subtitle").textContent = status.workspace + (status.model ? " · " + status.model : "");
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  autoGrow();
  const empty = $("empty-state");
  if (empty) empty.remove();
  addMessage("user", text);
  let taskId = null;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: currentSession }),
    });
    if (!res.ok) {
      const detail = (await res.json()).detail || ("HTTP " + res.status);
      addMessage("assistant", "");
      const b = $("messages").lastElementChild.querySelector(".bubble");
      b.innerHTML = '<div class="error-banner">' + esc(String(detail)) + "</div>";
      return;
    }
    const data = await res.json();
    taskId = data.task_id;
    if (data.session_id !== currentSession) currentSession = data.session_id;
  } catch (err) {
    addMessage("assistant", "Failed to reach the chatbot server: " + err.message);
    return;
  }
  setBusy(true);
  activeBubble = null;
  stream = new EventSource("/api/stream/" + taskId);
  stream.addEventListener("text", (ev) => {
    const data = JSON.parse(ev.data);
    const bubble = ensureAssistantBubble();
    bubble.innerHTML = renderMarkdown(data.text || "");
    bubble.scrollIntoView({ block: "end", behavior: "smooth" });
  });
  stream.addEventListener("tool_call", (ev) => {
    const data = JSON.parse(ev.data);
    const meta = activeBubble ? activeBubble.querySelector(".meta") : null;
    const chip = document.createElement("span");
    chip.className = "tool-chip";
    chip.textContent = "⚙ " + (data.tool || "tool");
    if (activeBubble) activeBubble.querySelector(".bubble").appendChild(chip);
    if (meta && activeBubble) {
      meta.textContent = "running " + (data.tool || "tool") + "…";
      meta.className = "meta model-tag";
    }
  });
  stream.addEventListener("model", (ev) => {
    const data = JSON.parse(ev.data);
    if (data.model && activeBubble) {
      const meta = activeBubble.querySelector(".meta");
      meta.textContent = "⚡ " + data.model;
      meta.className = "meta model-tag";
    }
  });
  stream.addEventListener("error", (ev) => {
    let detail = "Unknown agent error";
    try { detail = JSON.parse(ev.data).error || detail; } catch (e) {}
    ensureAssistantBubble();
    const bubble = activeBubble.querySelector(".bubble");
    bubble.innerHTML = '<div class="error-banner">' + esc(detail) + "</div>";
  });
  stream.addEventListener("session", (ev) => {
    const data = JSON.parse(ev.data);
    if (data.session_id) currentSession = data.session_id;
  });
  stream.addEventListener("done", () => {
    if (stream) stream.close();
    stream = null;
    setBusy(false);
    if (activeBubble) {
      activeBubble.querySelector(".bubble").classList.remove("cursor");
      activeBubble.querySelector(".meta").textContent = "done";
    }
    activeBubble = null;
    refreshSessions();
  });
  stream.onerror = () => {
    if (stream) { stream.close(); stream = null; }
    setBusy(false);
    if (activeBubble) {
      activeBubble.querySelector(".bubble").classList.remove("cursor");
      activeBubble.querySelector(".meta").textContent = "disconnected";
    }
    activeBubble = null;
  };
}

function autoGrow() {
  const ta = $("input");
  ta.style.height = "auto";
  ta.style.height = Math.min(160, ta.scrollHeight) + "px";
}

$("send").addEventListener("click", send);
$("stop").addEventListener("click", async () => {
  await fetch("/api/cancel", { method: "POST" });
  $("stop").textContent = "stopping…";
});
$("new-chat").addEventListener("click", newChat);
$("session-picker").addEventListener("change", (e) => loadSession(e.target.value));
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
init();
</script>
</body>
</html>

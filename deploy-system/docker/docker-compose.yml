version: '3.8'

services:
  control-panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      - DATABASE_URL=sqlite:///./data/control_panel.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - control-panel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Example agent (for testing)
  agent-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python /app/agent/agent.py --register agent-1 --control-panel-url http://control-panel:8080
    depends_on:
      - control-panel
    environment:
      - AGENT_NAME=agent-1
    restart: unless-stopped

volumes:
  control-panel-data:

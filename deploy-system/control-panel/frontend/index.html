<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substrate Deploy Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
        .status-online { @apply bg-green-500; }
        .status-offline { @apply bg-gray-400; }
        .status-error { @apply bg-red-500; }
    </style>
</head>
<body class="bg-gray-50">
    <div x-data="dashboard()" x-init="init()" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
                <h1 class="text-3xl font-bold text-gray-900">Substrate Deploy Control Panel</h1>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Total Agents</dt>
                                    <dd class="text-2xl font-semibold text-gray-900" x-text="stats.total_agents">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <svg class="h-6 w-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Online Agents</dt>
                                    <dd class="text-2xl font-semibold text-green-600" x-text="stats.online_agents">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white overflow-hidden shadow rounded-lg">
                    <div class="p-5">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <svg class="h-6 w-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                </svg>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Total Deployments</dt>
                                    <dd class="text-2xl font-semibold text-gray-900" x-text="stats.total_deployments">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Agents Section -->
            <div class="bg-white shadow rounded-lg mb-8">
                <div class="px-4 py-5 sm:px-6 flex justify-between items-center">
                    <h2 class="text-lg font-medium text-gray-900">Registered Agents</h2>
                    <button @click="showRegisterModal = true" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
                        Register Agent
                    </button>
                </div>
                <div class="border-t border-gray-200">
                    <ul class="divide-y divide-gray-200">
                        <template x-for="agent in agents" :key="agent.id">
                            <li class="px-4 py-4 sm:px-6">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center min-w-0">
                                        <div class="flex-shrink-0">
                                            <span class="inline-block h-3 w-3 rounded-full" :class="'status-' + agent.status"></span>
                                        </div>
                                        <div class="ml-4">
                                            <p class="text-sm font-medium text-blue-600 truncate" x-text="agent.name"></p>
                                            <p class="text-sm text-gray-500" x-text="agent.hostname || 'Unknown host'"></p>
                                        </div>
                                    </div>
                                    <div class="ml-4 flex-shrink-0 flex space-x-4">
                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                              :class="{
                                                  'bg-green-100 text-green-800': agent.status === 'online',
                                                  'bg-gray-100 text-gray-800': agent.status === 'offline',
                                                  'bg-red-100 text-red-800': agent.status === 'error'
                                              }"
                                              x-text="agent.status">
                                        </span>
                                        <button @click="deployToAgent(agent)" class="text-sm text-blue-600 hover:text-blue-900">Deploy</button>
                                        <button @click="deleteAgent(agent.id)" class="text-sm text-red-600 hover:text-red-900">Delete</button>
                                    </div>
                                </div>
                                <div class="mt-2 text-xs text-gray-400">
                                    <span x-show="agent.last_heartbeat">Last seen: <span x-text="formatTime(agent.last_heartbeat)"></span></span>
                                    <span x-show="agent.version" class="ml-4">Version: <span x-text="agent.version || 'N/A'"></span></span>
                                </div>
                            </li>
                        </template>
                        <li x-show="agents.length === 0" class="px-4 py-8 text-center text-gray-500">
                            No agents registered yet. Click "Register Agent" to add one.
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Deployments Section -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:px-6">
                    <h2 class="text-lg font-medium text-gray-900">Recent Deployments</h2>
                </div>
                <div class="border-t border-gray-200">
                    <ul class="divide-y divide-gray-200">
                        <template x-for="deployment in deployments" :key="deployment.id">
                            <li class="px-4 py-4 sm:px-6">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900">Deployment <span x-text="deployment.id.substring(0, 8)"></span></p>
                                        <p class="text-sm text-gray-500">Version: <span x-text="deployment.version"></span></p>
                                    </div>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                          :class="{
                                              'bg-green-100 text-green-800': deployment.status === 'success',
                                              'bg-yellow-100 text-yellow-800': deployment.status === 'deploying',
                                              'bg-red-100 text-red-800': deployment.status === 'failed',
                                              'bg-gray-100 text-gray-800': deployment.status === 'pending'
                                          }"
                                          x-text="deployment.status">
                                    </span>
                                </div>
                                <div class="mt-2 text-xs text-gray-400">
                                    Started: <span x-text="formatTime(deployment.started_at)"></span>
                                </div>
                            </li>
                        </template>
                        <li x-show="deployments.length === 0" class="px-4 py-8 text-center text-gray-500">
                            No deployments yet.
                        </li>
                    </ul>
                </div>
            </div>
        </main>

        <!-- Register Agent Modal -->
        <div x-show="showRegisterModal" x-cloak class="fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="showRegisterModal = false"></div>

                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Register New Agent</h3>
                        <div class="mt-4">
                            <label for="agent-name" class="block text-sm font-medium text-gray-700">Agent Name</label>
                            <input type="text" x-model="newAgentName" id="agent-name" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="my-agent">
                        </div>
                        <div class="mt-4">
                            <label for="agent-hostname" class="block text-sm font-medium text-gray-700">Hostname (optional)</label>
                            <input type="text" x-model="newAgentHostname" id="agent-hostname" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="agent-host">
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button @click="registerAgent()" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">
                            Register
                        </button>
                        <button @click="showRegisterModal = false" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Deploy Modal -->
        <div x-show="showDeployModal" x-cloak class="fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="showDeployModal = false"></div>

                <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                        <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Deploy to Agent</h3>
                        <div class="mt-4">
                            <p class="text-sm text-gray-500">Deploying to: <span x-text="selectedAgent?.name" class="font-medium"></span></p>
                        </div>
                        <div class="mt-4">
                            <label for="deploy-version" class="block text-sm font-medium text-gray-700">Version</label>
                            <input type="text" x-model="deployVersion" id="deploy-version" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="1.0.0">
                        </div>
                        <div class="mt-4">
                            <label for="deploy-files" class="block text-sm font-medium text-gray-700">Files URL</label>
                            <input type="text" x-model="deployFilesUrl" id="deploy-files" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="https://example.com/app.tar.gz">
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                        <button @click="startDeployment()" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">
                            Deploy
                        </button>
                        <button @click="showDeployModal = false" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:w-auto sm:text-sm">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function dashboard() {
            return {
                stats: {
                    total_agents: 0,
                    online_agents: 0,
                    offline_agents: 0,
                    total_deployments: 0,
                    successful_deployments: 0,
                    failed_deployments: 0,
                },
                agents: [],
                deployments: [],
                showRegisterModal: false,
                showDeployModal: false,
                newAgentName: '',
                newAgentHostname: '',
                selectedAgent: null,
                deployVersion: '',
                deployFilesUrl: '',
                ws: null,

                async init() {
                    await this.loadStats();
                    await this.loadAgents();
                    await this.loadDeployments();
                    this.connectWebSocket();

                    // Refresh data every 30 seconds
                    setInterval(() => {
                        this.loadStats();
                        this.loadAgents();
                        this.loadDeployments();
                    }, 30000);
                },

                async loadStats() {
                    try {
                        const response = await fetch('/api/dashboard/stats');
                        this.stats = await response.json();
                    } catch (e) {
                        console.error('Failed to load stats:', e);
                    }
                },

                async loadAgents() {
                    try {
                        const response = await fetch('/api/agents');
                        this.agents = await response.json();
                    } catch (e) {
                        console.error('Failed to load agents:', e);
                    }
                },

                async loadDeployments() {
                    try {
                        const response = await fetch('/api/deployments');
                        this.deployments = await response.json();
                    } catch (e) {
                        console.error('Failed to load deployments:', e);
                    }
                },

                async registerAgent() {
                    try {
                        const response = await fetch('/api/agents', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.newAgentName,
                                hostname: this.newAgentHostname || null,
                            }),
                        });

                        if (response.ok) {
                            this.showRegisterModal = false;
                            this.newAgentName = '';
                            this.newAgentHostname = '';
                            await this.loadAgents();
                            await this.loadStats();
                        } else {
                            const error = await response.json();
                            alert('Failed to register agent: ' + error.detail);
                        }
                    } catch (e) {
                        console.error('Failed to register agent:', e);
                        alert('Failed to register agent');
                    }
                },

                async deleteAgent(agentId) {
                    if (!confirm('Are you sure you want to delete this agent?')) {
                        return;
                    }

                    try {
                        const response = await fetch(`/api/agents/${agentId}`, {
                            method: 'DELETE',
                        });

                        if (response.ok) {
                            await this.loadAgents();
                            await this.loadStats();
                        } else {
                            alert('Failed to delete agent');
                        }
                    } catch (e) {
                        console.error('Failed to delete agent:', e);
                        alert('Failed to delete agent');
                    }
                },

                deployToAgent(agent) {
                    this.selectedAgent = agent;
                    this.showDeployModal = true;
                },

                async startDeployment() {
                    try {
                        const response = await fetch('/api/deployments', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                agent_id: this.selectedAgent.id,
                                version: this.deployVersion,
                                files_url: this.deployFilesUrl,
                            }),
                        });

                        if (response.ok) {
                            this.showDeployModal = false;
                            this.deployVersion = '';
                            this.deployFilesUrl = '';
                            await this.loadDeployments();
                            await this.loadStats();
                        } else {
                            const error = await response.json();
                            alert('Failed to create deployment: ' + error.detail);
                        }
                    } catch (e) {
                        console.error('Failed to create deployment:', e);
                        alert('Failed to create deployment');
                    }
                },

                connectWebSocket() {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws`;

                    this.ws = new WebSocket(wsUrl);

                    this.ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);

                        if (data.type === 'agent_status_updated' || data.type === 'agent_created' || data.type === 'agent_deleted') {
                            this.loadAgents();
                            this.loadStats();
                        } else if (data.type === 'deployment_updated') {
                            this.loadDeployments();
                            this.loadStats();
                        }
                    };

                    this.ws.onclose = () => {
                        console.log('WebSocket closed, reconnecting...');
                        setTimeout(() => this.connectWebSocket(), 5000);
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };
                },

                formatTime(timestamp) {
                    if (!timestamp) return 'Never';
                    const date = new Date(timestamp);
                    const now = new Date();
                    const diff = (now - date) / 1000;

                    if (diff < 60) return 'Just now';
                    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
                    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
                    return date.toLocaleDateString();
                },
            };
        }
    </script>
</body>
</html>

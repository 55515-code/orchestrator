[project]
name = "local-agent-substrate"
version = "0.1.0"
description = "Reusable local AI-agent substrate with automated prompt chaining."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
  "langchain-ollama>=0.2.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.6.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "sqlalchemy>=2.0.30",
  "apscheduler>=3.10.4",
  "croniter>=2.0.5",
  "keyring>=25.5.0",
  "python-multipart>=0.0.26",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "rich>=13.9.4",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "prometheus-client>=0.20.0",
  "httpx>=0.27.0",
  "psutil>=5.9.0",
  "cryptography>=42.0.0",
  "pystray>=0.19.5",
  "pillow>=12.3.0",
  "pygobject>=3.56.3",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0.0",
  "ruff>=0.11.0",
]
crypto = [
  "mnemonic>=0.21",
  "eth-account>=0.13",
]
render = [
  "torch>=2.13.0",
  "diffusers>=0.39.0",
  "transformers>=4.46.0",
  "accelerate>=0.34.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.2.0",
  "protobuf>=5.0.0",
  "huggingface-hub[hf_transfer]>=0.25.0",
  "pillow>=12.3.0",
  "bitsandbytes>=0.43.0; platform_machine=='x86_64'",
  "optimum-quanto>=0.2.0",
  "torchao>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing the substrate package;
# imports after that setup are intentional (E402).
"scripts/serve_dashboard.py" = ["E402"]
"scripts/serve_pipelines.py" = ["E402"]
"scripts/crypto/backup_proton.py" = ["E402"]
"scripts/crypto/wallet_gen.py" = ["E402"]
"scripts/crypto/export_site_data.py" = ["E402"]

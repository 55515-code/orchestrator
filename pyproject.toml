[project]
name = "local-agent-substrate"
version = "0.1.0"
description = "Reusable local AI-agent substrate with automated prompt chaining."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
  "langchain-ollama>=0.2.0",
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.6.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "sqlalchemy>=2.0.30",
  "apscheduler>=3.10.4",
  "croniter>=2.0.5",
  "keyring>=25.5.0",
  "python-multipart>=0.0.26",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "rich>=13.9.4",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "prometheus-client>=0.20.0",
  "httpx>=0.27.0",
  "psutil>=5.9.0",
  "cryptography>=42.0.0",
  "pystray>=0.19.5",
  "pillow>=12.3.0",
]

[project.optional-dependencies]
desktop = [
  "pygobject>=3.56.3",
]
dev = [
  "pre-commit>=4.0.0",
  # Upper bound so a major ruff release cannot silently redefine the lint gate.
  "ruff>=0.11.0,<0.17.0",
  # CI runs `uv run mypy substrate scripts tests` (.github/workflows/ci.yml).
  # mypy was invoked but never declared, so that step failed to spawn on every
  # run. Declared here so `uv sync --dev` provisions it.
  "mypy>=1.11.0",
  # The test suite imports httpx via starlette's TestClient; CI ran
  # `uv run pytest` without them declared.
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
crypto = [
  "mnemonic>=0.21",
  "eth-account>=0.13",
]
render = [
  "torch>=2.13.0",
  "diffusers>=0.39.0",
  "transformers>=4.46.0",
  "accelerate>=0.34.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.2.0",
  "protobuf>=5.0.0",
  "huggingface-hub[hf_transfer]>=0.25.0",
  "pillow>=12.3.0",
  "bitsandbytes>=0.43.0; platform_machine=='x86_64'",
  "optimum-quanto>=0.2.0",
  "torchao>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly. Previously no `select` was declared, so the gate inherited
# ruff's built-in defaults — which expanded substantially between 0.11 and 0.16.
# Combined with an unbounded `ruff>=0.11.0`, that meant the lint contract
# changed meaning on dependency resolution alone (344 findings appeared without
# a single line of source changing). Declaring the set makes CI reproducible.
#
# This is the long-standing ruff default set: pyflakes (F) plus the pycodestyle
# error subsets that catch real defects rather than formatting preferences.
select = ["E4", "E7", "E9", "F"]
# Broader families (BLE001 blind-except, S110 try-except-pass, DTZ naive
# datetimes, PLW1510 subprocess-without-check, TRY004) surface ~300 further
# findings. They are tracked as a deliberate backlog in
# system_registry.yaml -> known_issues.lint_backlog rather than enabled here,
# because clearing them changes exception-handling behaviour and must be done
# in reviewed batches, not as a side effect of a lint config change.

[tool.ruff.lint.per-file-ignores]
# Standalone scripts and tests bootstrap sys.path before importing the substrate
# package; imports after that setup are intentional (E402).
"scripts/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"tests/test_change_snapshot.py" = ["E402"]
"tests/test_encrypted_chain.py" = ["E402"]
"tests/test_settings_policy.py" = ["E402"]
# web.py contains inline imports inside the live YAML validator (lines 2386,
# 2398) to avoid importing yaml at module load when the validator is unused.
"substrate/web.py" = ["E402"]

version: 1

manager_priority:
  - uv_tool
  - pipx
  - brew
  - apt
  - dnf
  - pacman
  - winget
  - choco
  - scoop
  - manual

profiles:
  - id: web_ux_frameworks
    name: Web UX and Panel Frameworks
    description: Established frontend and visualization libraries for the OpenClaw Gateway control panel. Kept lean; assembled on first use.
    tools:
      - id: chartjs
        name: Chart.js
        binary: chartjs
        source_url: https://www.chartjs.org/
        install:
          manual:
            - Include Chart.js via CDN in panel templates (no build step required).
      - id: fastapi
        name: FastAPI
        binary: fastapi
        source_url: https://fastapi.tiangolo.com/
        install:
          uv_tool:
            - uv tool install fastapi
          pipx:
            - pipx install fastapi
          manual:
            - Install FastAPI from PyPI or follow the official installation guide.
      - id: jinja2
        name: Jinja2
        binary: jinja2
        source_url: https://jinja.palletsprojects.com/
        install:
          uv_tool:
            - uv tool install jinja2
          pipx:
            - pipx install jinja2
          manual:
            - Install Jinja2 from PyPI; it is included with Flask/FastAPI stacks.

  - id: remote_access
    name: Remote Access and Tunnel Tools
    description: Optional tools for no-domain remote ops panel access and recovery.
    tools:
      - id: cloudflared
        name: cloudflared
        binary: cloudflared
        source_url: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
        install:
          brew:
            - brew install cloudflared
          winget:
            - winget install --id Cloudflare.cloudflared -e
          manual:
            - Visit the official cloudflared docs and install from the platform package instructions.
      - id: tailscale
        name: Tailscale
        binary: tailscale
        source_url: https://tailscale.com/kb/
        install:
          brew:
            - brew install tailscale
          apt:
            - curl -fsSL https://tailscale.com/install.sh | sh
          winget:
            - winget install --id Tailscale.Tailscale -e
          manual:
            - Use the official Tailscale installer from the KB for your operating system.
      - id: ssh
        name: OpenSSH Client
        binary: ssh
        source_url: https://www.openssh.com/
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y openssh-client
          brew:
            - brew install openssh
          winget:
            - winget install --id Microsoft.OpenSSH.Beta -e
          manual:
            - Install the OpenSSH client package from your OS distribution channel.

  - id: android_lab
    name: Android Security Lab
    description: Open-source Android tooling assembled on demand for authorized testing.
    tools:
      - id: adb
        name: Android Debug Bridge
        binary: adb
        source_url: https://developer.android.com/tools/releases/platform-tools
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y android-sdk-platform-tools
          brew:
            - brew install android-platform-tools
          winget:
            - winget install --id Google.PlatformTools -e
          choco:
            - choco install adb -y
          manual:
            - Download Android SDK Platform-Tools from the official Android developer page.
      - id: fastboot
        name: Fastboot
        binary: fastboot
        source_url: https://developer.android.com/tools/releases/platform-tools
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y android-sdk-platform-tools
          brew:
            - brew install android-platform-tools
          winget:
            - winget install --id Google.PlatformTools -e
          manual:
            - Install Android SDK Platform-Tools to get fastboot.
      - id: apktool
        name: Apktool
        binary: apktool
        source_url: https://apktool.org/
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y apktool
          brew:
            - brew install apktool
          manual:
            - Install Apktool from the official project release instructions.
      - id: jadx
        name: JADX
        binary: jadx
        source_url: https://github.com/skylot/jadx
        install:
          brew:
            - brew install jadx
          apt:
            - sudo apt-get update
            - sudo apt-get install -y jadx
          manual:
            - Download JADX releases from the official GitHub repository.
      - id: frida_tools
        name: Frida CLI tools
        binary: frida
        source_url: https://frida.re/docs/frida-cli/
        install:
          uv_tool:
            - uv tool install frida-tools
          pipx:
            - pipx install frida-tools
          manual:
            - Install frida-tools using your Python packaging workflow.
      - id: mobsf
        name: MobSF
        binary: docker
        source_url: https://github.com/MobSF/Mobile-Security-Framework-MobSF
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y docker.io
          brew:
            - brew install --cask docker
          winget:
            - winget install --id Docker.DockerDesktop -e
          manual:
            - Install Docker and run the official MobSF container workflow.

  - id: ai_agent_frameworks
    name: AI Agent Frameworks and Inference
    description: Hugging Face agent frameworks and open-source LLM serving engines for local and hosted inference.
    tools:
      - id: smolagents
        name: smolagents
        binary: smolagent
        source_url: https://huggingface.co/docs/smolagents
        install:
          uv_tool:
            - uv tool install smolagents
          pipx:
            - pipx install smolagents
          manual:
            - Install smolagents from PyPI; the package provides the smolagent and webagent CLI commands.
      - id: vllm
        name: vLLM
        binary: vllm
        source_url: https://docs.vllm.ai/
        install:
          uv_tool:
            - uv tool install vllm
          pipx:
            - pipx install vllm
          manual:
            - Install vLLM from PyPI or follow the official installation guide for your CUDA/hardware version.
      - id: sglang
        name: SGLang
        binary: sglang
        source_url: https://docs.sglang.ai/
        install:
          uv_tool:
            - uv tool install sglang
          pipx:
            - pipx install sglang
          manual:
            - Install SGLang from PyPI or follow the official installation guide for your CUDA/hardware version.

  - id: detection_content
    name: Detection and Template Content
    description: Maintained template/rule ecosystems for reusable detection and testing content.
    tools:
      - id: nuclei
        name: Nuclei
        binary: nuclei
        source_url: https://docs.projectdiscovery.io/tools/nuclei/overview
        install:
          brew:
            - brew install nuclei
          apt:
            - sudo apt-get update
            - sudo apt-get install -y nuclei
          manual:
            - Install Nuclei from official ProjectDiscovery packages or binaries.
      - id: sigma_cli
        name: sigma-cli
        binary: sigma
        source_url: https://sigmahq.io/
        install:
          uv_tool:
            - uv tool install sigma-cli
          pipx:
            - pipx install sigma-cli
          manual:
            - Install sigma-cli from its maintained Python package source.

  - id: hak5_hardware_lab
    name: Hak5 Hardware Security Lab
    description: Open-source tooling for Hak5 device ecosystems and comparable hardware security, penetration-testing, wireless-auditing, SDR, RFID, and HID projects.
    tools:
      - id: duckyencoder
        name: DuckyScript Encoder
        binary: duckyencoder
        source_url: https://github.com/hak5darren/USB-Rubber-Ducky
        install:
          manual:
            - Build the USB Rubber Ducky encoder from source or use a community Docker image (e.g. wwehr/usb-rubber-ducky).
      - id: flipper
        name: Flipper Zero Firmware / CLI
        binary: flipper
        source_url: https://github.com/flipperdevices/flipperzero-firmware
        install:
          manual:
            - Flash Flipper Zero firmware from official releases or build from source; use qFlipper for desktop management.
      - id: proxmark3
        name: Proxmark3
        binary: proxmark3
        source_url: https://github.com/Proxmark/proxmark3
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y proxmark3
          manual:
            - Build Proxmark3 client and firmware from source for your device variant (RDV2, RV4, etc.).
      - id: hackrf
        name: HackRF One / Portapack
        binary: hackrf_info
        source_url: https://github.com/greatscottgadgets/hackrf
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y hackrf
          manual:
            - Install HackRF tools from Great Scott Gadgets packages or build from source.
      - id: aircrack_ng
        name: Aircrack-ng Suite
        binary: aircrack-ng
        source_url: https://github.com/aircrack-ng/aircrack-ng
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y aircrack-ng
          brew:
            - brew install aircrack-ng
          manual:
            - Install Aircrack-ng from your OS distribution or build from source with required dependencies.
      - id: bettercap
        name: Bettercap
        binary: bettercap
        source_url: https://github.com/bettercap/bettercap
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y bettercap
          brew:
            - brew install bettercap
          manual:
            - Install Bettercap from official releases or your OS package manager.
      - id: kismet
        name: Kismet
        binary: kismet
        source_url: https://github.com/kismetwireless/kismet
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y kismet
          brew:
            - brew install kismet
          manual:
            - Install Kismet from official packages or build from source.
      - id: nmap
        name: Nmap
        binary: nmap
        source_url: https://github.com/nmap/nmap
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y nmap
          brew:
            - brew install nmap
          manual:
            - Install Nmap from official binaries or your OS package manager.
      - id: hcxdumptool
        name: hcxdumptool / hcxtools
        binary: hcxdumptool
        source_url: https://github.com/ZerBea/hcxdumptool
        install:
          manual:
            - Build hcxdumptool and hcxtools from source; required for PMKID and handshake capture workflows.
      - id: reaver
        name: Reaver / Bully
        binary: reaver
        source_url: https://github.com/t6x/reaver-wps-fork-t6x
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y reaver bully
          manual:
            - Install Reaver or Bully for WPS PIN brute-forcing from source or package repositories.
      - id: wifite
        name: Wifite
        binary: wifite
        source_url: https://github.com/kimocoder/wifite
        install:
          manual:
            - Clone and run Wifite from source for automated WiFi attack workflows.
      - id: p4wnp1
        name: P4wnP1 ALOA
        binary: p4wnp1
        source_url: https://github.com/mame82/P4wnP1
        install:
          manual:
            - Flash P4wnP1 image to Raspberry Pi Zero SD card; configure via p4wnp1.service or USB gadget scripts.
      - id: flipper_badusb_tools
        name: Flipper Zero BadUSB Tools
        binary: flipper
        source_url: https://github.com/flipperdevices/flipperzero-firmware
        install:
          manual:
            - Use qFlipper to manage apps; install community BadUSB apps from Flipper Zero app catalog.
      - id: omg_cable_tools
        name: O.MG Cable Tools
        binary: omg
        source_url: https://github.com/hak5/omg-payloads
        install:
          manual:
            - Use O.MG Cable web interface or command-line tooling for payload deployment and configuration.

  - id: storage_dedup
    name: Btrfs Storage Deduplication
    description: Offline deduplication tooling for Btrfs-backed substrate storage (see docs/btrfs-optimization.md).
    tools:
      - id: duperemove
        name: duperemove
        binary: duperemove
        source_url: https://github.com/markfasheh/duperemove
        install:
          apt:
            - sudo apt-get update
            - sudo apt-get install -y duperemove
          dnf:
            - sudo dnf install -y duperemove
          pacman:
            - sudo pacman -S --noconfirm duperemove
          brew:
            - brew install duperemove
          manual:
            - Build duperemove from the upstream GitHub releases; requires glib2, sqlite3, libxxhash >= 0.8, util-linux, and libbsd.

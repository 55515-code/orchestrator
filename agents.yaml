  # ARIN creative-production substrate (ingested from
  # ARIN_Kilo_Autonomous_Novel_Package.zip). Scheduled runs perform only
  # bounded, zero-cost maintenance (scaffold/hash/quality-gate self-check,
  # telemetry snapshot); drafting/publishing/spending require an on-demand
  # --directive and are additionally hard-gated at Tier 2 inside
  # substrate/agents/creative.py regardless of the tier below.
  # See creative/ARIN/ and docs/arin-novel-automation.md.
  - id: creative-arin
    role: creative-agent
    repo_slug: substrate-core
    pass: development
    cadence: daily
    autonomy_tier: 1
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role creative-agent --repo substrate-core

  - id: email-manager
    role: email-manager
    repo_slug: substrate-core
    pass: research
    cadence: daily
    autonomy_tier: 1
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role email-manager --repo substrate-core

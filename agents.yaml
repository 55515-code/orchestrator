  - id: community-manager
    role: community-manager
    repo_slug: substrate-core
    pass: research
    cadence: every_4_hours
    autonomy_tier: 1
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role community-manager --repo substrate-core

  - id: market-research

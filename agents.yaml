version: 1

# Agent roster for automated development, research, and moderation.
# Autonomy tiers:
#   0 — always automatic (notes, reports, branches, test runs)
#   1 — automatic only when validation is green (branch commits, queue holds)
#   2 — always requires an explicit human directive (merges, deploys, approvals, outbound replies)
# Cadences: hourly, every_4_hours, daily, weekly, on_demand

agents:
  - id: research-substrate
    role: research-agent
    repo_slug: substrate-core
    pass: research
    cadence: daily
    autonomy_tier: 0
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role research-agent --repo substrate-core

  - id: research-luigios
    role: research-agent
    repo_slug: luigios
    pass: research
    cadence: daily
    autonomy_tier: 0
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role research-agent --repo luigios

  - id: research-site
    role: research-agent
    repo_slug: ahrondarnell-site
    pass: research
    cadence: daily
    autonomy_tier: 0
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role research-agent --repo ahrondarnell-site

  - id: dev-substrate
    role: dev-agent
    repo_slug: substrate-core
    pass: development
    cadence: daily
    autonomy_tier: 1
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role dev-agent --repo substrate-core


  - id: update-substrate
    role: update-agent
    repo_slug: substrate-core
    pass: development
    cadence: weekly
    autonomy_tier: 1
    provider: local
    enabled: true
    command: scripts/substrate_cli.py agent-run --role update-agent --repo substrate-core

  - id: update-luigios
    role: update-agent
    repo_slug: luigios
    pass: development
    cadence: weekly
    autonomy_tier: 1
    provider: local
    enabled: true
